# --- App & Database ---
spring.application.name=webrac

# --- H2 Database (Chay ngay khong can cai MySQL, luu du lieu vao thu muc ./data) ---
spring.datasource.url=jdbc:h2:file:./data/webrac;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Cau hinh MySQL (Mo comment khi muon dung MySQL that) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/webrac?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Email (SMTP Gmail) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Mail admin ---
app.mail.adminTo=contact@wasteheroes.vn