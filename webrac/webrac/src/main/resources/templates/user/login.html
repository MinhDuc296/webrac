<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập – WasteHeroes</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Design System -->
    <link th:href="@{/assets/css/styles.css}" href="/assets/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-custom sticky-top">
    <div class="container">
        <a class="navbar-brand-logo text-decoration-none" th:href="@{/}">
            <span class="brand-icon"><i class="bi bi-recycle"></i></span>
            <span><span class="text-success">Waste</span>Heroes</span>
        </a>
        <a th:href="@{/}" class="btn btn-outline-custom py-1 px-3">
            <i class="bi bi-house me-1"></i>Trang chủ
        </a>
    </div>
</nav>

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <span class="brand-icon mx-auto mb-2" style="width: 50px; height: 50px; font-size: 1.5rem;"><i class="bi bi-recycle"></i></span>
                            <h3 class="fw-bold text-dark mt-2">Chào mừng trở lại!</h3>
                            <p class="text-secondary small">Đăng nhập tài khoản để quản lý đơn hàng & thu gom rác.</p>
                        </div>

                        <!-- Thông báo lỗi hoặc đăng xuất -->
                        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2 small">
                            <i class="bi bi-exclamation-triangle-fill"></i>
                            <div>Email hoặc mật khẩu không chính xác. Vui lòng thử lại!</div>
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center gap-2 small">
                            <i class="bi bi-check-circle-fill"></i>
                            <div>Bạn đã đăng xuất tài khoản thành công.</div>
                        </div>

                        <!-- DEMO ACCOUNTS QUICK-FILL (Extremely helpful for portfolio reviewers) -->
                        <div class="p-3 bg-light rounded-3 border mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="fw-bold small text-success"><i class="bi bi-key-fill me-1"></i>Tài khoản Demo Portfolio:</span>
                            </div>
                            <div class="d-flex flex-column gap-2">
                                <button type="button" class="btn btn-sm btn-outline-dark text-start d-flex justify-content-between align-items-center py-2 px-3 rounded-2" onclick="fillAdmin()">
                                    <span><strong>👑 Admin:</strong> admin@wasteheroes.vn</span>
                                    <span class="badge bg-dark">Nhấp để điền</span>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-secondary text-start d-flex justify-content-between align-items-center py-2 px-3 rounded-2" onclick="fillUser()">
                                    <span><strong>👤 User:</strong> user@wasteheroes.vn</span>
                                    <span class="badge bg-secondary">Nhấp để điền</span>
                                </button>
                            </div>
                        </div>

                        <form method="post" action="/login">
                            <div class="mb-3">
                                <label class="form-label fw-semibold small">Địa chỉ Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                    <input type="email" id="emailInput" name="email" class="form-control border-start-0 py-2" placeholder="admin@wasteheroes.vn" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold small">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" id="passwordInput" name="password" class="form-control border-start-0 py-2" placeholder="••••••" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary-gradient w-100 py-2 fw-semibold">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập ngay
                            </button>
                        </form>

                        <p class="text-center mt-4 mb-0 small text-secondary">
                            Chưa có tài khoản? <a th:href="@{/register}" class="text-success fw-bold text-decoration-none">Đăng ký thành viên mới</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    function fillAdmin() {
        document.getElementById('emailInput').value = 'admin@wasteheroes.vn';
        document.getElementById('passwordInput').value = 'admin123';
    }
    function fillUser() {
        document.getElementById('emailInput').value = 'user@wasteheroes.vn';
        document.getElementById('passwordInput').value = 'user123';
    }
</script>
</body>
</html>
