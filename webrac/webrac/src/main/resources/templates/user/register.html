<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký tài khoản – WasteHeroes</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Design System -->
    <link th:href="@{/assets/css/styles.css}" href="/assets/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-custom sticky-top">
    <div class="container">
        <a class="navbar-brand-logo text-decoration-none" th:href="@{/}">
            <span class="brand-icon"><i class="bi bi-recycle"></i></span>
            <span><span class="text-success">Waste</span>Heroes</span>
        </a>
        <a th:href="@{/}" class="btn btn-outline-custom py-1 px-3">
            <i class="bi bi-house me-1"></i>Trang chủ
        </a>
    </div>
</nav>

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <span class="brand-icon mx-auto mb-2" style="width: 50px; height: 50px; font-size: 1.5rem;"><i class="bi bi-person-plus"></i></span>
                            <h3 class="fw-bold text-dark mt-2">Tạo tài khoản mới</h3>
                            <p class="text-secondary small">Trở thành đối tác xanh và tham gia giao dịch vật liệu tái sinh.</p>
                        </div>

                        <form id="registerForm" onsubmit="handleRegister(event)">
                            <div class="mb-3">
                                <label class="form-label fw-semibold small">Họ và tên</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                    <input type="text" id="fullName" class="form-control border-start-0 py-2" placeholder="Nguyễn Văn A" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold small">Địa chỉ Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                    <input type="email" id="email" class="form-control border-start-0 py-2" placeholder="email@domain.com" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold small">Số điện thoại</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-telephone"></i></span>
                                    <input type="tel" id="phone" class="form-control border-start-0 py-2" placeholder="0908 123 456">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold small">Mật khẩu (tối thiểu 6 ký tự)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" id="password" class="form-control border-start-0 py-2" placeholder="••••••••" required minlength="6">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary-gradient w-100 py-2 fw-semibold">
                                <i class="bi bi-check2-circle me-1"></i>Đăng ký ngay
                            </button>
                        </form>

                        <div id="regStatus" class="alert mt-3 d-none small"></div>

                        <p class="text-center mt-4 mb-0 small text-secondary">
                            Đã có tài khoản? <a th:href="@{/login}" class="text-success fw-bold text-decoration-none">Đăng nhập</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    async function handleRegister(e) {
      e.preventDefault();
      const data = {
        fullName: document.getElementById('fullName').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        password: document.getElementById('password').value.trim(),
      };

      const statusEl = document.getElementById('regStatus');
      statusEl.className = 'alert alert-info mt-3 d-block small';
      statusEl.textContent = 'Đang xử lý đăng ký...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          statusEl.className = 'alert alert-success mt-3 d-block small';
          statusEl.innerHTML = '🎉 <strong>Đăng ký thành công!</strong> Bạn có thể <a href="/login" class="alert-link">Đăng nhập ngay</a>.';
          e.target.reset();
        } else {
          const text = await res.text();
          throw new Error(text || 'Đăng ký thất bại. Vui lòng kiểm tra lại thông tin!');
        }
      } catch (err) {
        statusEl.className = 'alert alert-danger mt-3 d-block small';
        statusEl.textContent = '❌ Lỗi: ' + err.message;
      }
    }
</script>
</body>
</html>
