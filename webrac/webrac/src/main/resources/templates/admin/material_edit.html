<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cập Nhật Vật Liệu – WasteHeroes Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/assets/css/styles.css}" href="/assets/css/styles.css" rel="stylesheet">
    <style>
        .admin-nav { background: #0f172a; border-bottom: 1px solid #1e293b; }
    </style>
</head>
<body class="bg-light">

<!-- ADMIN TOP NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark admin-nav sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/admin/dashboard">
            <span class="badge bg-success p-2 rounded-3"><i class="bi bi-recycle fs-5"></i></span>
            <span>WasteHeroes <span class="badge bg-secondary small">Admin Portal</span></span>
        </a>
        <div class="collapse navbar-collapse show" id="adminNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                <li class="nav-item"><a class="nav-link fw-semibold" href="/admin/dashboard">Tổng quan</a></li>
                <li class="nav-item"><a class="nav-link active fw-semibold text-white" href="/admin/materials">Kho vật liệu</a></li>
                <li class="nav-item"><a class="nav-link fw-semibold" href="/admin/orders">Đơn hàng</a></li>
                <li class="nav-item"><a class="nav-link fw-semibold" href="/admin/contacts">Yêu cầu</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5" style="max-width: 650px;">
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-pencil-square text-warning me-2"></i>Chỉnh Sửa Thông Tin Vật Liệu</h5>
            <a href="/admin/materials" class="btn btn-sm btn-outline-secondary rounded-pill px-3">Quay lại</a>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/admin/materials/save}" th:object="${material}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label fw-semibold small">Tên vật liệu</label>
                    <input type="text" th:field="*{name}" class="form-control rounded-3" required>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-7">
                        <label class="form-label fw-semibold small">Giá bán (₫)</label>
                        <input type="number" step="100" th:field="*{price}" class="form-control rounded-3" required>
                    </div>
                    <div class="col-5">
                        <label class="form-label fw-semibold small">Đơn vị tính</label>
                        <input type="text" th:field="*{unit}" class="form-control rounded-3" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold small">Số lượng tồn kho</label>
                    <input type="number" step="0.1" th:field="*{quantity}" class="form-control rounded-3" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold small">Link Ảnh (URL)</label>
                    <input type="url" th:field="*{image}" class="form-control rounded-3">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold small">Mô tả chi tiết</label>
                    <textarea th:field="*{description}" class="form-control rounded-3" rows="3"></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary-gradient flex-grow-1 py-2 fw-semibold">
                        <i class="bi bi-check-lg me-1"></i>Lưu Thay Đổi
                    </button>
                    <a href="/admin/materials" class="btn btn-light border rounded-3 px-4">Hủy bỏ</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
