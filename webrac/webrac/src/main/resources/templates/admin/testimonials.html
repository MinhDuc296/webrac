<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Admin • Testimonials</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">WasteHeroes</a>
        <div class="ms-auto d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" href="/admin/dashboard">Dashboard</a>
            <a class="btn btn-outline-light btn-sm" href="/admin/contacts">Contacts</a>
            <a class="btn btn-outline-light btn-sm active" href="/admin/testimonials">Testimonials</a>
            <a class="btn btn-warning btn-sm" href="/logout">Đăng xuất</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <h1 class="h4 mb-3">Quản lý phản hồi (Testimonials)</h1>

    <!-- Form thêm mới -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="row g-2">
                <div class="col-md-3">
                    <input id="author" class="form-control" placeholder="Tên khách hàng">
                </div>
                <div class="col-md-3">
                    <input id="email" type="email" class="form-control" placeholder="Email (tùy chọn)">
                </div>
                <div class="col-md-2">
                    <input id="rating" type="number" min="1" max="5" class="form-control" placeholder="Đánh giá 1–5">
                </div>
                <div class="col-md-3">
                    <input id="content" class="form-control" placeholder="Nội dung phản hồi">
                </div>
                <div class="col-md-1 d-grid">
                    <button id="btnAdd" class="btn btn-primary">Thêm</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bảng -->
    <div class="table-responsive card shadow-sm">
        <table class="table table-sm align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th>#</th>
                <th>Tên</th>
                <th>Email</th>
                <th>Đánh giá</th>
                <th>Nội dung</th>
                <th>Hiển thị</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t, i : ${items}">
                <td th:text="${i.index+1}">1</td>
                <td><input class="form-control form-control-sm"
                           th:value="${t.authorName}"
                           th:attr="data-id=${t.id},data-field=authorName"></td>
                <td><input type="email" class="form-control form-control-sm"
                           th:value="${t.authorEmail}"
                           th:attr="data-id=${t.id},data-field=authorEmail"></td>
                <td style="width:120px;"><input type="number" min="1" max="5"
                                                class="form-control form-control-sm"
                                                th:value="${t.rating}"
                                                th:attr="data-id=${t.id},data-field=rating"></td>
                <td style="min-width:300px;"><input class="form-control form-control-sm"
                                                    th:value="${t.content}"
                                                    th:attr="data-id=${t.id},data-field=content"></td>
                <td>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox"
                               th:checked="${t.published}"
                               th:attr="data-id=${t.id}">
                    </div>
                </td>
                <td>
                    <button class="btn btn-sm btn-success btn-save"
                            th:attr="data-id=${t.id}">Lưu</button>
                    <button class="btn btn-sm btn-danger btn-del"
                            th:attr="data-id=${t.id}">Xoá</button>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(items)}">
                <td colspan="7" class="text-center text-secondary py-4">Chưa có phản hồi.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ĐỔI script để IDE highlight: dùng th:inline="javascript" + CDATA -->
<script th:inline="javascript">
    /*<![CDATA[*/
      async function post(url, body) {
        const res = await fetch(url, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
      }

      async function patch(url, body) {
        const res = await fetch(url, {
          method: 'PATCH',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
      }

      async function del(url) {
        const res = await fetch(url, { method: 'DELETE' });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
      }

      // ➕ Thêm mới
      document.getElementById('btnAdd')?.addEventListener('click', async () => {
        const author  = document.getElementById('author').value.trim();
        const email   = document.getElementById('email').value.trim();
        const rating  = parseInt(document.getElementById('rating').value || '0', 10);
        const content = document.getElementById('content').value.trim();
        if (!author || !content) return alert('Điền tên và nội dung');

        try {
          await post('/api/admin/testimonials', {
            authorName: author,
            authorEmail: email || null,
            rating: rating || null,
            content
          });
          location.reload();
        } catch (e) { alert('Thêm thất bại'); }
      });

      // 💾 Lưu / 🗑️ Xoá
      document.addEventListener('click', async (e) => {
        if (e.target.matches('.btn-save')) {
          const id = e.target.getAttribute('data-id');
          const inputs = document.querySelectorAll(`input[data-id="${id}"][data-field]`);
          const body = {};
          inputs.forEach(i => body[i.getAttribute('data-field')] = i.value);
          try {
            await patch(`/api/admin/testimonials/${id}`, body);
            e.target.classList.replace('btn-success', 'btn-secondary');
            e.target.textContent = 'Đã lưu';
            setTimeout(() => location.reload(), 700);
          } catch (_) { alert('Lưu thất bại'); }
        }

        if (e.target.matches('.btn-del')) {
          if (!confirm('Xoá phản hồi này?')) return;
          const id = e.target.getAttribute('data-id');
          try {
            await del(`/api/admin/testimonials/${id}`);
            location.reload();
          } catch (_) { alert('Xoá thất bại'); }
        }
      });

      // 🔁 Đổi trạng thái hiển thị
      document.addEventListener('change', async (e) => {
        if (e.target.matches('input.form-check-input[type="checkbox"]')) {
          const id = e.target.getAttribute('data-id');
          const value = e.target.checked;
          try {
            await fetch(`/api/admin/testimonials/${id}/publish?value=${value}`, { method: 'PATCH' });
          } catch (_) {
            alert('Đổi trạng thái hiển thị thất bại');
            e.target.checked = !value;
          }
        }
      });
    /*]]>*/
</script>
</body>
</html>
